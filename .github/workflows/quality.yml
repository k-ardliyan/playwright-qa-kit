name: Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm run install:mcp-server

      - name: Materialize plaintext local.env for CI
        run: |
          if [ ! -f config/environments/local.env ] || grep -q 'encrypted:' config/environments/local.env 2>/dev/null; then
            cp config/environments/local.env.example config/environments/local.env
            echo "[CI] Materialized plaintext config/environments/local.env from template"
          fi

      - name: Run quality gate
        run: npm run test:quality
