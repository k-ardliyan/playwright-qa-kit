name: MCP Compatibility Check

on:
  push:
    branches: [main, master]
    paths:
      - 'src/shared/mcp/**'
      - 'src/shared/evidence/**'
      - 'src/shared/utils/**'
      - 'src/support/pw/**'
      - 'src/__tests__/unit/**'
      - 'tools/mcp/**'
      - 'tools/scripts/mcp*/**'
      - 'tools/scripts/mcp-compat-check.ts'
      - 'tools/scripts/playwright-mcp-launch.ts'
      - 'tools/scripts/playwright-test-mcp-launch.ts'
      - 'tools/scripts/playwright-mcp*'
      - 'package.json'
      - 'package-lock.json'
      - '.mcp.json'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/shared/mcp/**'
      - 'src/shared/evidence/**'
      - 'src/shared/utils/**'
      - 'src/support/pw/**'
      - 'src/__tests__/unit/**'
      - 'tools/mcp/**'
      - 'tools/scripts/mcp*/**'
      - 'tools/scripts/mcp-compat-check.ts'
      - 'tools/scripts/playwright-mcp-launch.ts'
      - 'tools/scripts/playwright-test-mcp-launch.ts'
      - 'tools/scripts/playwright-mcp*'
      - 'package.json'
      - 'package-lock.json'
      - '.mcp.json'

jobs:
  mcp-compat:
    name: MCP Compatibility Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MCP server dependencies
        run: npm run install:mcp-server

      - name: Build MCP server
        run: npm run mcp:build

      - name: Materialize plaintext local.env for CI
        run: |
          if [ ! -f config/environments/local.env ] || grep -q 'encrypted:' config/environments/local.env 2>/dev/null; then
            cp config/environments/local.env.example config/environments/local.env
            echo "[CI] Materialized plaintext config/environments/local.env from template"
          fi

      - name: Run MCP Compatibility Check
        run: npm run mcp:check

      - name: Run MCP Unit Tests
        run: npm run test:unit

      - name: Run Property Tests (validator rules)
        run: npm run test:property
